# ProsperoLichess - Lint, test, build, and publish a release for each new version.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also publish this run's compiler cache as the build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    timeout-minutes: 45
    # The job's own list (it replaces the workflow's): reading the source, and signing the
    # ZIP's attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 lld-18 make ninja-build ccache pkg-config tar unzip wget libcurl4-openssl-dev

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/ps5-opengl
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/fetch-opengl-sdk.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked replaces that file.
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        id: version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          # Only a version tag releases: push the tag to release on purpose.
          # The push-to-main case below can no longer fire: pushes to main do
          # not start this workflow.
          release=false
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            release=true
          elif [[ '${{ github.event.repository.private }}' == false ]] &&
               [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main ]] &&
               ! git ls-remote --exit-code --tags origin "refs/tags/$content_version" >/dev/null; then
            release=true
          fi
          echo "version=$content_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release this build: $release ($content_version)"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the
      # version in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=ProsperoLichess-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # clang-tidy does not run here; make lint and make tidy run it locally.
      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The ZIP is the one release format; no image is built here.
      - name: Build the release folder and ZIP
        run: make app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # The console only starts an app whose files are open to all (0777).
      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1

      - name: Check the app-folder ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          python3 - "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          title, version = sys.argv[1:3]
          archive = title + ".zip"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              meta = json.loads(z.read(title + "/sce_sys/param.json"))
              assert meta["contentVersion"] == version, meta["contentVersion"]
              print(f"{archive}: {len(names)} entries, all 0777, version {version}")
          PY

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Only a run started by hand reaches this job, so a pull request never writes what later
  # builds start from; the build job itself cannot write to a release.
  snapshot:
    name: Publish the compiler cache snapshot
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Replace the snapshot in the build-cache release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ccache-snapshot --dir snapshot
          gh release upload build-cache "snapshot/ccache-clang18.tar" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    name: GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "ProsperoLichess-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          shopt -s nullglob
          folder_zips=(PPSA*.zip)
          # The artifact holds exactly these two files at its root.
          if (( ${#files[@]} != 2 || ${#folder_zips[@]} != 1 )) || [[ ! -f SHA256SUMS ]]; then
            echo "Expected exactly one app-folder ZIP and SHA256SUMS at the artifact root." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          echo "folder_zip=${folder_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FOLDER_ZIP: ${{ steps.package.outputs.folder_zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$FOLDER_ZIP" "release/$CHECKSUM")
          # A release's files are the ones this run built. A file already on the release is
          # never replaced or removed: its checksum may be recorded elsewhere.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release exists (notes written ahead, or a draft): its title and notes stay.
            existing=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            existing_zip=$(grep -i -m1 '\.zip$' <<< "$existing" || true)
            if [[ -n $existing_zip ]]; then
              echo "::warning title=Release file not from this run::A release for $VERSION already has $existing_zip; it was not replaced. It was not published by this run and may have no attestation."
            else
              for asset in "${assets[@]}"; do
                if grep -Fxq -- "${asset##*/}" <<< "$existing"; then
                  echo "::warning title=Release file not from this run::A release for $VERSION already has ${asset##*/}; it was not replaced. It was not published by this run and may have no attestation."
                else
                  gh release upload "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done
            fi
          else
            # Creates the version tag at the commit that was just built and tested.
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "ProsperoLichess $VERSION"
          fi
